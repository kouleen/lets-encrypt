name: GitHub Docker Image CI
on:
  push:
    branches: [ "release" ]
  pull_request:
    branches: [ "release" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 拉取代码
    - uses: actions/checkout@v4

    # 初始化Docker构建工具
    - name: Set up Docker 
      uses: docker/setup-buildx-action@v3
      
    # 登录Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    # 构建镜像并推送到 hub.docker.com kouleen/golive-server:latest
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true # 构建完成自动推送
        tags: kouleen/lets-encrypt:latest
      #run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

    - name: Call Custom Callback API
      if : always()
      run: |
        curl -X POST "https://www.kouleen.cn/api/docker/webhook/put" \
        -H "Content-Type: application/json" \
        -d '{
          "runId": "${{ github.run_id }}",
          "imageName": "kouleen/lets-encrypt:latest",
          "containerName": "lets-encrypt",
          "branch": "${{ github.ref_name }}",
          "repo": "${{ github.repository }}",
          "htmlUrl": "${{ github.event.repository.html_url }}",
          "cloneUrl": "${{ github.event.repository.clone_url }}",
          "sshUrl": "${{ github.event.repository.ssh_url }}",
          "status": "${{ job.status }}",
          "actor": "${{ github.actor }}",
          "commitMessage": "${{ github.event.head_commit.message }}",
          "workflow": "${{ github.workflow }}",
          "triggerType": "${{ github.event_name }}",
          "networkMode": "",
          "restartPolicy": "",
          "removeOldExist": true,
          "enableIT": true,
          "portMapping": {
              "8099": "8099"
          },
          "envList": [],
          "volumeBinds": [],
          "cmdOverride": []
        }'
