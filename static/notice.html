<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:0;background:#f5f7fa;font-family:微软雅黑,sans-serif;font-size:14px;color:#333;">
<div style="width:85%;max-width:800px;margin:30px auto;background:#fff;border-radius:8px;box-shadow:0 0 12px rgba(0,0,0,0.06);overflow:hidden;">
    <div style="background-color:#409eff;padding:18px;text-align:center;">
        <h2 style="margin:0;color:#fff;font-size:18px;font-weight:normal;">域名SSL证书过期提醒通知</h2>
    </div>
    <div style="padding:25px 30px;">
        <p style="margin:0 0 10px;line-height:1.7;">尊敬的用户：</p>
        <p style="margin:0 0 20px;line-height:1.7;">您好！系统监测到以下域名的SSL证书即将到期，请及时进行续期操作，避免证书过期导致网站无法正常访问、业务中断。</p>
        <table width="100%" border="1" cellpadding="10" cellspacing="0" style="border-collapse:collapse;border:1px solid #e5e6eb;margin:10px 0 20px;text-align:center;">
            <thead>
            <tr style="background-color:#f0f5ff;">
                <th style="border:1px solid #e5e6eb;padding:12px 8px;color:#333;font-weight:bold;">域名</th>
                <th style="border:1px solid #e5e6eb;padding:12px 8px;color:#333;font-weight:bold;">证书过期时间</th>
                <th style="border:1px solid #e5e6eb;padding:12px 8px;color:#333;font-weight:bold;">续期阈值天数</th>
                <th style="border:1px solid #e5e6eb;padding:12px 8px;color:#333;font-weight:bold;">剩余可用天数</th>
            </tr>
            </thead>
            <tbody>
            {{range .Items}}
            <tr>
                <td>{{.Domain}}</td>
                <td>{{.ExpireTime.Format "2006-01-02 15:04:05"}}</td>
                <td>{{.RenewalDay}}</td>
                <td>{{.RemainDay}}</td>
            </tr>
            {{end}}
            </tbody>
        </table>
        <p style="margin:20px 0 0;color:#e6a23c;font-weight:500;text-align:center;">温馨提示：请在证书过期前完成续期，保障业务正常运行！</p>
        <!-- 页脚右对齐 text-align:right -->
        <div style="margin-top:30px;padding-top:15px;border-top:1px solid #eee;font-size:12px;color:#999;line-height:1.6;text-align:center;">
            <p style="margin:0 0 5px;">此为系统自动发送邮件，请勿直接回复</p>
            <p style="margin:0;">SSL证书自动管理系统</p>
        </div>
    </div>
</div>
</body>
</html>
